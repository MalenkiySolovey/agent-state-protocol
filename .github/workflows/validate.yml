name: Validate protocol

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Validate schemas, examples, fixtures, and privacy guards
        run: python tools/validate.py
      - name: Test validator privacy checks
        run: python -m unittest discover -s tests -p "test_*.py"
